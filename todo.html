<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لائحة المهام</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f2ec;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(500px, 92%);
      padding: 30px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0;
      color: #1d1e22;
    }

    .subtitle {
      color: #74716b;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 24px 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9d4ca;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-button {
      padding: 13px 18px;
      background: #1d1e22;
      color: white;
      white-space: nowrap;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #f3eee4;
    }

    .delete-button {
      width: 30px;
      height: 30px;
      background: #dc5b52;
      color: white;
      font-weight: bold;
    }

    .empty-message {
      color: #8a857c;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>لائحة المهام</h1>
    <p class="subtitle">كتب المهمة ديالك وزيدها للائحة.</p>

    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="مثلاً: نتعلم JavaScript">
      <button class="add-button" type="submit">زيد المهمة</button>
    </form>

    <p class="empty-message" id="emptyMessage">ما كاين حتى مهمة دابا.</p>

    <ul id="taskList"></ul>
  </main>

  <script>
    let tasks = [];

    function showTasks() {
      let taskList = document.getElementById("taskList");
      let emptyMessage = document.getElementById("emptyMessage");

      taskList.innerHTML = "";

      if (tasks.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
      }

      for (let i = 0; i < tasks.length; i++) {
        let li = document.createElement("li");
        let text = document.createElement("span");
        let deleteButton = document.createElement("button");

        text.textContent = tasks[i];
        deleteButton.textContent = "×";
        deleteButton.className = "delete-button";

        deleteButton.onclick = function () {
          tasks.splice(i, 1);
          showTasks();
        };

        li.appendChild(text);
        li.appendChild(deleteButton);
        taskList.appendChild(li);
      }
    }

    document.getElementById("taskForm").onsubmit = function (event) {
      event.preventDefault();

      let input = document.getElementById("taskInput");
      let task = input.value.trim();

      if (task !== "") {
        tasks.push(task);
        input.value = "";
        showTasks();
      }
    };

    showTasks();
  </script>
</body>
</html>
