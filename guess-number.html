<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة خمن الرقم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #312e81, #7c3aed);
      font-family: Arial, sans-serif;
    }

    .game {
      width: min(440px, 92%);
      padding: 38px 30px;
      border-radius: 25px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      color: #312e81;
    }

    p {
      color: #666;
      line-height: 1.7;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 15px 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #5b21b6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #7c3aed;
    }

    #message {
      min-height: 25px;
      margin-top: 20px;
      color: #312e81;
      font-weight: bold;
    }

    .again-button {
      display: none;
      margin-top: 10px;
      background: #f59e0b;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>خمن الرقم 🎯</h1>

    <p>أنا اخترت رقماً بين 1 و10. حاول تعرفو.</p>

    <input id="guess" type="number" min="1" max="10" placeholder="كتب رقم من 1 حتى 10">

    <button onclick="checkGuess()">جرّب الحظ ديالك</button>

    <p id="message"></p>

    <button class="again-button" id="againButton" onclick="newGame()">
      عاود اللعب
    </button>
  </main>

  <script>
    let secretNumber = Math.floor(Math.random() * 10) + 1;

    function checkGuess() {
      let guess = Number(document.getElementById("guess").value);
      let message = document.getElementById("message");

      if (guess < 1 || guess > 10) {
        message.textContent = "كتب رقم بين 1 و10.";
      } else if (guess === secretNumber) {
        message.textContent = "برافو! ربحتي 🎉";
        document.getElementById("againButton").style.display = "block";
      } else if (guess < secretNumber) {
        message.textContent = "الرقم ديالي أكبر.";
      } else {
        message.textContent = "الرقم ديالي أصغر.";
      }
    }

    function newGame() {
      secretNumber = Math.floor(Math.random() * 10) + 1;
      document.getElementById("guess").value = "";
      document.getElementById("message").textContent = "";
      document.getElementById("againButton").style.display = "none";
    }
  </script>
</body>
</html>
