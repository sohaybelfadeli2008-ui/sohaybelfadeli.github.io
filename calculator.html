<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آلة حاسبة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f2ec;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 330px;
      padding: 22px;
      border-radius: 25px;
      background: #1d1e22;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 18px;
      color: white;
      font-size: 22px;
      text-align: center;
    }

    #screen {
      width: 100%;
      height: 65px;
      margin-bottom: 15px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #f7f5f0;
      color: #1d1e22;
      font-size: 27px;
      text-align: left;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 12px;
      background: #383a43;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #535665;
    }

    .operator {
      background: #d9a83d;
      color: #201b12;
    }

    .clear {
      background: #dc5b52;
    }

    .equal {
      background: #49a772;
      grid-column: span 2;
    }
  </style>
</head>

<body>
  <main class="calculator">
    <h1>آلة حاسبة</h1>

    <input id="screen" type="text" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearScreen()">C</button>
      <button onclick="writeNumber('(')">(</button>
      <button onclick="writeNumber(')')">)</button>
      <button class="operator" onclick="writeNumber('/')">÷</button>

      <button onclick="writeNumber('7')">7</button>
      <button onclick="writeNumber('8')">8</button>
      <button onclick="writeNumber('9')">9</button>
      <button class="operator" onclick="writeNumber('*')">×</button>

      <button onclick="writeNumber('4')">4</button>
      <button onclick="writeNumber('5')">5</button>
      <button onclick="writeNumber('6')">6</button>
      <button class="operator" onclick="writeNumber('-')">−</button>

      <button onclick="writeNumber('1')">1</button>
      <button onclick="writeNumber('2')">2</button>
      <button onclick="writeNumber('3')">3</button>
      <button class="operator" onclick="writeNumber('+')">+</button>

      <button onclick="writeNumber('0')">0</button>
      <button onclick="writeNumber('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </main>

  <script>
    function writeNumber(value) {
      document.getElementById("screen").value += value;
    }

    function clearScreen() {
      document.getElementById("screen").value = "";
    }

    function calculate() {
      let screen = document.getElementById("screen");

      try {
        screen.value = Function("return " + screen.value)();
      } catch {
        screen.value = "خطأ";
      }
    }
  </script>
</body>
</html>
