<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="welcome-screen" id="welcomeScreen">

    <p class="top-title">WELCOME TO MY SPACE</p>
    <h1>جرّ الخيط.</h1>
    <p class="description">وخلي الموقع يرحب بك.</p>

    <div class="lamp-area">
      <div class="lamp">
        <div class="shade"></div>
        <div class="neck"></div>
        <div class="base"></div>
      </div>

      <button class="cord" id="cord" onclick="pullCord()" aria-label="جر الخيط">
        <span></span>
        <b></b>
      </button>

      <!-- هادي البطاقة كتهبط من تحت المصباح -->
      <div class="name-card" id="nameCard">
        <p>شنو سميتك؟</p>
        <input id="nom" type="text" placeholder="كتب سميتك هنا">
        <button onclick="enterSite()">دخل للموقع</button>
      </div>
    </div>

    <p class="hint">اضغط على الخيط ديال المصباح</p>
  </section>

  <section class="site" id="site">
    <div class="profile-card">
      <img src="photo.jpg" alt="صورتي">

      <p class="welcome-message" id="welcomeMessage"></p>

      <h2>أنا [كتب اسمك هنا]</h2>

      <p class="about">
        كنبدأ رحلة تعلم تطوير المواقع. كنعمل بـ HTML وCSS
        وJavaScript، وهاد الموقع هو أول مشروع شخصي ديالي.
      </p>

      <a href="cv.pdf" target="_blank">من أنا؟ شوف السيرة الذاتية</a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
